[workspace]
resolver = "2"
members = [
    "crates/secrets-core",
    "crates/secrets-storage-postgres",
    "crates/secrets-engine-kv",
    "crates/secrets-engine-postgres",
    "crates/secrets-engine-github",
    "crates/secrets-engine-gitlab",
    "crates/secrets-engine-aws",
    "crates/secrets-engine-gcp",
    "crates/secrets-engine-gworkspace",
    "crates/secrets-engine-dropbox",
    "crates/secrets-engine-m365",
    "crates/secrets-engine-federation",
    "crates/secrets-auth-userpass",
    "crates/secrets-auth-oidc",
    "crates/secrets-server",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/typednotes/secrets"

[workspace.dependencies]
secrets-core = { path = "crates/secrets-core", version = "1.0.0" }
secrets-storage-postgres = { path = "crates/secrets-storage-postgres", version = "1.0.0" }
secrets-engine-kv = { path = "crates/secrets-engine-kv", version = "1.0.0" }
secrets-engine-postgres = { path = "crates/secrets-engine-postgres", version = "1.0.0" }
secrets-engine-github = { path = "crates/secrets-engine-github", version = "1.0.0" }
secrets-engine-gitlab = { path = "crates/secrets-engine-gitlab", version = "1.0.0" }
secrets-engine-aws = { path = "crates/secrets-engine-aws", version = "1.0.0" }
secrets-engine-gcp = { path = "crates/secrets-engine-gcp", version = "1.0.0" }
secrets-engine-gworkspace = { path = "crates/secrets-engine-gworkspace", version = "1.0.0" }
secrets-engine-dropbox = { path = "crates/secrets-engine-dropbox", version = "1.0.0" }
secrets-engine-m365 = { path = "crates/secrets-engine-m365", version = "1.0.0" }
secrets-engine-federation = { path = "crates/secrets-engine-federation", version = "1.0.0" }
secrets-auth-userpass = { path = "crates/secrets-auth-userpass", version = "1.0.0" }
secrets-auth-oidc = { path = "crates/secrets-auth-oidc", version = "1.0.0" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
base64 = "0.23"
hex = "0.4"
sha2 = "0.11"
toml = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
jsonwebtoken = "11"

[profile.release]
lto = true
