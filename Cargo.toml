[workspace]
resolver = "2"
members = [
    "crates/secrets-core",
    "crates/secrets-storage-postgres",
    "crates/secrets-engine-kv",
    "crates/secrets-engine-postgres",
    "crates/secrets-auth-userpass",
    "crates/secrets-auth-oidc",
    "crates/secrets-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
secrets-core = { path = "crates/secrets-core" }
secrets-storage-postgres = { path = "crates/secrets-storage-postgres" }
secrets-engine-kv = { path = "crates/secrets-engine-kv" }
secrets-engine-postgres = { path = "crates/secrets-engine-postgres" }
secrets-auth-userpass = { path = "crates/secrets-auth-userpass" }
secrets-auth-oidc = { path = "crates/secrets-auth-oidc" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
base64 = "0.23"
hex = "0.4"
sha2 = "0.11"
toml = "0.8"

[profile.release]
lto = true
