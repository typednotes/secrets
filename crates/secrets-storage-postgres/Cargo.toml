[package]
name = "secrets-storage-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL-backed StorageBackend implementation for the secrets server."
keywords = ["secrets", "postgresql", "storage", "vault"]
categories = ["database"]

[dependencies]
secrets-core.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
chrono.workspace = true
tracing.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
