[package]
name = "secrets-server"
version.workspace = true
edition.workspace = true
license.workspace = true
# Distributed as a container image, not on crates.io. This also keeps it out
# of the release workflow's derived publish list.
publish = false

[[bin]]
name = "secrets-server"
path = "src/main.rs"

[dependencies]
secrets-core.workspace = true
secrets-storage-postgres.workspace = true
secrets-engine-kv.workspace = true
secrets-engine-postgres.workspace = true
secrets-engine-github.workspace = true
secrets-engine-gitlab.workspace = true
secrets-engine-aws.workspace = true
secrets-engine-gcp.workspace = true
secrets-engine-gworkspace.workspace = true
secrets-engine-dropbox.workspace = true
secrets-engine-m365.workspace = true
secrets-engine-federation.workspace = true
secrets-auth-userpass.workspace = true
secrets-auth-oidc.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
figment = { version = "0.10", features = ["env", "toml"] }

[dev-dependencies]
figment = { version = "0.10", features = ["env", "toml", "test"] }
async-trait.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
chrono.workspace = true
