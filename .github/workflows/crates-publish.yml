name: Publish crates.io release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches workspace version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml workspace version $cargo_version" >&2
            exit 1
          fi

      # secrets-core has no in-workspace dependencies and every other library
      # crate depends only on it, so it must land on crates.io first.
      #
      # The list is derived from the workspace rather than hardcoded: it was a
      # hardcoded list once, and it silently went stale the moment a batch of
      # engine crates was added. secrets-server opts out via `publish = false`.
      #
      # Each publish is skipped if that exact version is already live, so a
      # retry after a partial failure (e.g. crates.io rate limiting) is safe.
      - name: Publish library crates
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          others=$(echo "$metadata" | jq -r '.packages[] | select(.publish != []) | .name' \
            | sort | grep -vx secrets-core)
          order=$(printf 'secrets-core\n%s\n' "$others")
          echo "Publishing in order:" $order

          # crates.io throttles *new* crate names far harder than new versions
          # of existing ones: a handful land and the rest are refused with 429
          # until the bucket refills. The 1.0.0 release introduced eight new
          # crates and stopped after five, so a release like that has to wait
          # the limit out rather than fail. The error names the time to retry
          # after, so honour it instead of guessing.
          publish_with_retry() {
            crate=$1
            for attempt in $(seq 1 10); do
              if out=$(cargo publish -p "$crate" --locked 2>&1); then
                echo "$out"
                return 0
              fi
              echo "$out"
              case "$out" in
                *"429 Too Many Requests"*) ;;
                # Anything else is a real failure; retrying would just hide it.
                *) return 1 ;;
              esac

              retry_at=$(printf '%s' "$out" \
                | sed -n 's/.*Please try again after \(.*\) and see.*/\1/p' | head -1)
              wait=120
              if [ -n "$retry_at" ] && target=$(date -u -d "$retry_at" +%s 2>/dev/null); then
                wait=$(( target - $(date -u +%s) + 5 ))
                [ "$wait" -lt 5 ] && wait=5
              fi
              echo "::warning::$crate: crates.io rate limit hit, waiting ${wait}s (attempt $attempt/10)"
              sleep "$wait"
            done
            echo "::error::$crate: still rate-limited after 10 attempts"
            return 1
          }

          # Read line by line rather than relying on unquoted word splitting,
          # so the loop does not depend on the shell's IFS behaviour.
          while read -r crate; do
            [ -n "$crate" ] || continue
            version=$(echo "$metadata" | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            if curl -sf -A "secrets-publish-ci (https://github.com/typednotes/secrets)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version already published, skipping"
              continue
            fi
            # cargo waits for the new version to appear in the index before
            # returning, which is what lets the next crate depend on it.
            publish_with_retry "$crate"
          done <<< "$order"
