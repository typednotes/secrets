name: Publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

# GITHUB_TOKEN can push to ghcr.io but cannot flip a brand-new package's
# visibility to public — that's a one-time manual step after the first push.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/typednotes/secrets-server
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mirrors :latest into Scaleway Container Registry, which is what
      # typednotes-infra's `secrets-server` Serverless Container actually deploys —
      # Scaleway supports pulling public images from ghcr.io directly, but discourages
      # it for anything real (uncontrolled rate limiting) and doesn't support private
      # external registries at all, which this GHCR package is. Runs only on tagged
      # releases, matching the `latest` tag's own condition above. Needs a
      # `SCW_SECRET_KEY` repo secret (an API secret key for the `typednotes` project),
      # a one-time manual setup step this workflow cannot do for itself.
      - name: Mirror latest into Scaleway Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo
          skopeo copy \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "nologin:${{ secrets.SCW_SECRET_KEY }}" \
            docker://ghcr.io/typednotes/secrets-server:latest \
            docker://rg.fr-par.scw.cloud/typednotes/secrets-server:latest
